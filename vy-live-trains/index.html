<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vy Live Trains</title>
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        #map { width: 100vw; height: 100vh; }

        #status {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.75);
            color: #fff;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 13px;
            z-index: 10;
            pointer-events: none;
        }

        #legend {
            position: absolute;
            bottom: 30px;
            right: 10px;
            background: rgba(0, 0, 0, 0.75);
            color: #fff;
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 12px;
            z-index: 10;
        }
        #legend h3 { margin-bottom: 6px; font-size: 13px; }
        .legend-item { display: flex; align-items: center; gap: 6px; margin: 3px 0; }
        .legend-dot {
            width: 12px; height: 12px; border-radius: 50%;
            border: 1.5px solid white; flex-shrink: 0;
        }

        .maplibregl-popup-content {
            padding: 10px 14px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 13px;
            line-height: 1.4;
        }
        .popup-title { font-weight: 700; font-size: 14px; margin-bottom: 4px; }
        .popup-detail { color: #555; }
        .popup-delay-late { color: #e74c3c; font-weight: 600; }
        .popup-delay-ok { color: #27ae60; font-weight: 600; }
    </style>
</head>
<body>
    <div id="map"></div>
    <div id="status">Loading train data...</div>
    <div id="legend">
        <h3>Vy Live Trains</h3>
        <div class="legend-item"><div class="legend-dot" style="background:#2ecc71"></div> On time</div>
        <div class="legend-item"><div class="legend-dot" style="background:#f39c12"></div> 1–5 min late</div>
        <div class="legend-item"><div class="legend-dot" style="background:#e74c3c"></div> &gt; 5 min late</div>
    </div>

    <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
    <script src="app.js"></script>
</body>
</html>
